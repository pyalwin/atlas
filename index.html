<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d12" />
    <meta name="description" content="Atlas — a local, three-dimensional guide to your codebase." />
    <script>
      try {
        const saved = localStorage.getItem('atlas-theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <title>Atlas · Your code, connected.</title>
    <link rel="icon" type="image/svg+xml" href="/atlas.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
